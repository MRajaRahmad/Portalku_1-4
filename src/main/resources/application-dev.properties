server.port=8080
logging.level.id.ac.polinema.lumajang=DEBUG
app.pesan-sambutan=Mode pengembangan - data masih tersimpan di memori
spring.datasource.url=jdbc:postgresql://localhost:5432/portalku_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:raja}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false